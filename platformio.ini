[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

lib_deps = feilipu/FreeRTOS@^11.1.0-3

build_flags =
  -DUSE_FREERTOS
  -DBOARD_MEGA2560
  -Os
  -ffunction-sections
  -fdata-sections

build_src_filter = +<*>